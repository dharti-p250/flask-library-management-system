{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <div class="auth-header">
            <span class="auth-label">GET STARTED</span>
            <h1>Create Account</h1>
            <p>Join our library and start exploring books.</p>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="auth-form">

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-wrapper">
                    <span>👤</span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

            </div>

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">
                    <span>✉</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">
                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="auth-button">
                Create Account
                <span>→</span>
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="/signin">Sign In</a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
